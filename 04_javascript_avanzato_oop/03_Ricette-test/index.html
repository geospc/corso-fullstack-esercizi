        <div class="toolbar">

            <option value="dinner">Dinner</option>

            <option value="breakfast">Breakfast</option>
            <option value="snack">Snack</option>
            <option value="tea">Teatime</option>
          </select>
          <select id="sortBy">
            <option value="">Ordina…</option>
            <option value="abc">Nome ↑</option>
            <option value="rating">Rating ↑</option>
            <option value="prep">Tempo prep ↑</option>
          </select>
          <button id="newBtn" class="btn-primary">+ Nuova ricetta</button>
        </div>
      </div>
    </header>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>


    <!-- Modal "Nuova ricetta"-->
    <dialog id="modal">
      <form method="dialog" id="newForm" style="width: 50%; background:#0b1220; color:var(--text); border:1px solid var(--border); border-radius:14px; padding:16px; margin: 10% auto;">
        <h3 style="margin:0 0 10px 0">Crea nuova ricetta</h3>
        <div class="help">La creazione è simulata dall'API e restituisce un nuovo id.</div>
        <div class="divider"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
          <label>Nome<input name="name" required placeholder="Es. Spaghetti al pomodoro" /></label>
          <label>Immagine (URL)<input name="image" placeholder="https://…" /></label>
          <label>Difficoltà<select name="difficulty" required><option>Easy</option><option>Medium</option><option>Hard</option></select></label>
          <label>Meal type<select name="meal" required><option value="">—</option><option>Dinner</option><option>Lunch</option><option>Breakfast</option><option>Snack</option><option>Teatime</option></select></label>
          <label>Prep (min)<input name="prep" type="number" min="0" value="10"/></label>
          <label>Cook (min)<input name="cook" type="number" min="0" value="15"/></label>
          <label>Tags (virgola)<input name="tags" placeholder="italian, pasta"required /></label>
          <label>Rating<input name="rating" type="number" step="0.1" min="0" max="5" value="4.5"/></label>
        </div>
        <label style="display:block; margin-top:8px">Ingredienti (1 per riga)
          <textarea name="ingredients" rows="4" placeholder="spaghetti
            pomodori pelati
            aglio
            olio evo
            sale"></textarea>
        </label>
        <label style="display:block; margin-top:8px">Istruzioni (1 per riga)
          <textarea name="instructions" rows="4" placeholder="Cuoci la pasta
            Prepara il sugo
            Salta e servi"></textarea>
        </label>
        <div class="divider"></div>
        <div style="display:flex; gap:8px; justify-content:flex-end">
          <button class="btn" value="cancel">Annulla</button>
          <button class="btn-primary" value="default" id="saveBtn">Salva</button>
        </div>
      </form>
    </dialog>
